<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Cairo:wght@400;600&display=swap">
<style>
:root{--ink:#1a0823;--plum:#4a1259;--orchid:#a13a9b;--blush:#f6c9d8;--paper:#fbf3ee;--gold:#e8c27a;--kraft:#d9c9b0;
--serif:'Cormorant Garamond','Cairo',Georgia,serif;--script:'Pinyon Script','Cairo',cursive}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{min-height:100svh;color:var(--paper);font-family:var(--serif);background:radial-gradient(120% 80% at 50% 0%,#7a2a86 0%,var(--plum) 40%,var(--ink) 100%) fixed;overflow-x:hidden}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.spk{position:fixed;width:10px;height:10px;pointer-events:none;z-index:60;background:var(--blush);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spk .8s forwards}
@keyframes spk{to{transform:translateY(24px) scale(0) rotate(90deg);opacity:0}}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}

/* HERO */
#hero{position:relative;min-height:100svh;display:grid;place-items:center;overflow:hidden;padding:2rem 1rem}
.pola{position:absolute;width:clamp(100px,21vw,180px);background:#f7f2ee;padding:7px 7px 26px;box-shadow:0 18px 40px #0007;border-radius:2px;
 transform:translate(calc(var(--px,0)*var(--d)*1px),calc(var(--py,0)*var(--d)*1px)) rotate(var(--r));transition:transform .4s ease-out;opacity:0;animation:drop 1s var(--w) forwards}
.pola img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.p1{--r:-9deg;--d:10;--w:.3s;left:5%;top:8%}
.p2{--r:7deg;--d:-14;--w:.6s;right:5%;top:12%}
.p3{--r:-4deg;--d:8;--w:.9s;left:10%;bottom:7%}
@keyframes drop{from{opacity:0;margin-top:-40px}to{opacity:1;margin-top:0}}
.env{position:relative;width:min(84vw,440px);aspect-ratio:3/2;z-index:5;filter:drop-shadow(0 30px 40px #0009)}
.env .back{position:absolute;inset:0;background:var(--kraft);border-radius:6px}
.paper{position:absolute;inset:7% 6%;background:var(--paper);color:var(--plum);border-radius:3px;display:grid;place-items:center;text-align:center;
 transition:transform 1.1s .55s cubic-bezier(.3,.8,.3,1);z-index:2}
.paper b{display:block;font:400 clamp(2rem,9vw,3.2rem)/1 var(--script)}
.paper i{font-size:1.05rem}
.pocket{position:absolute;inset:0;background:#c7b494;clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);border-radius:6px;z-index:3}
.flap{position:absolute;left:0;top:0;width:100%;height:56%;background:#e3d4bb;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s;z-index:4}
.seal{position:absolute;left:50%;top:54%;width:62px;height:62px;translate:-50% -50%;border:0;border-radius:50%;z-index:6;color:#f3d9ff;font-size:1.4rem;
 background:radial-gradient(circle at 35% 30%,#d68cf0,#7b2d9a 55%,#42105a);box-shadow:0 4px 10px #0006,inset 0 0 0 4px #ffffff22;animation:beat 2s infinite;transition:scale .4s,opacity .4s}
@keyframes beat{50%{scale:1.1}}
.open .flap{transform:rotateX(180deg);z-index:1}
.open .paper{transform:translateY(-58%)}
.open .seal{scale:0;opacity:0;animation:none}
.hint{position:absolute;bottom:7%;left:0;right:0;text-align:center;font-style:italic;font-size:1.2rem;color:var(--blush);z-index:5;transition:opacity .4s}
.opened .hint{opacity:0}
.bf{position:absolute;width:74px;right:22%;bottom:16%;z-index:6;animation:drift 9s ease-in-out infinite alternate}
.bf svg{width:100%;animation:flap .5s ease-in-out infinite alternate;transform-origin:center}
@keyframes flap{to{transform:scaleX(.45)}}
@keyframes drift{to{transform:translate(-60px,-50px) rotate(-14deg)}}

/* AFTER OPEN */
.after{display:none}
.opened .after{display:block}
section.after{padding:12vh 1.25rem;display:none}
.opened section.after{display:block}
.card{max-width:36rem;margin:auto;background:var(--paper);color:#3a1446;padding:clamp(1.8rem,6vw,3.2rem);border-radius:4px;box-shadow:0 30px 60px #0008;position:relative;
 background-image:repeating-linear-gradient(transparent 0 33px,#a13a9b14 33px 34px)}
.card h2{font:400 clamp(2.6rem,10vw,4rem)/1.05 var(--script);color:var(--orchid);text-align:center;margin-bottom:1.4rem}
.card p{font-size:clamp(1.2rem,4.4vw,1.5rem);line-height:1.75;min-height:8em}
.card .sig{margin-top:1.6rem;text-align:right;font:400 2rem var(--script);color:var(--plum)}
.date{position:absolute;top:-16px;left:50%;translate:-50%;background:var(--plum);color:var(--gold);padding:.35rem 1.1rem;border-radius:99px;font-size:1.05rem;letter-spacing:.06em}
h3{font:400 clamp(2.2rem,8vw,3.4rem) var(--script);text-align:center;color:var(--blush);margin-bottom:2.2rem}
.strip{display:flex;justify-content:center;gap:clamp(.8rem,4vw,2rem);flex-wrap:wrap}
.strip figure{width:min(70vw,230px);background:#f7f2ee;padding:9px 9px 14px;box-shadow:0 20px 40px #0007;color:#4a1259;text-align:center;font-style:italic;transition:transform .4s}
.strip figure:nth-child(1){rotate:-4deg}.strip figure:nth-child(2){rotate:2deg;margin-top:1.5rem}.strip figure:nth-child(3){rotate:-2deg}
.strip figure:hover{transform:translateY(-8px) rotate(0)}
.strip img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;margin-bottom:.5rem}

/* CAKE */
#cake{text-align:center}
.cake{position:relative;width:220px;height:200px;margin:3rem auto 2rem}
.layer{position:absolute;left:0;right:0;border-radius:14px 14px 10px 10px}
.l1{bottom:0;height:70px;background:linear-gradient(#e88ab4,#c25a93)}
.l2{bottom:70px;left:24px;right:24px;height:62px;background:linear-gradient(#f6c9d8,#e9a2c1)}
.l2:before{content:"";position:absolute;left:0;right:0;top:0;height:20px;background:var(--paper);border-radius:14px 14px 60% 40%/14px 14px 100% 100%}
.candle{position:absolute;bottom:132px;width:8px;height:38px;background:repeating-linear-gradient(45deg,var(--gold) 0 6px,#fff 6px 12px);border-radius:3px}
.candle:nth-child(3){left:70px}.candle:nth-child(4){left:106px;height:46px}.candle:nth-child(5){left:142px}
.flame{position:absolute;left:50%;top:-22px;width:14px;height:22px;translate:-50%;background:radial-gradient(#fff 10%,#ffd36b 45%,#ff8a3d);border-radius:50% 50% 50% 50%/70% 70% 30% 30%;
 box-shadow:0 0 22px 6px #ffb54766;animation:fl .3s infinite alternate;transition:opacity .4s,scale .4s}
@keyframes fl{to{scale:.9 1.1;rotate:4deg}}
.blown .flame{opacity:0;scale:.2;animation:none}
.wish{min-height:3rem;font:400 clamp(1.8rem,7vw,2.6rem) var(--script);color:var(--gold);opacity:0;transition:opacity 1s}
.blown .wish{opacity:1}
.btn{margin-top:1rem;border:1px solid var(--blush);background:#ffffff14;padding:.8rem 1.8rem;border-radius:99px;font-size:1.25rem;backdrop-filter:blur(6px)}
.btn:hover{background:#ffffff28}
footer{padding:4rem 1rem 6rem;text-align:center;color:var(--blush);font-style:italic;font-size:1.2rem}
#mus{position:fixed;top:14px;right:14px;z-index:70;width:44px;height:44px;border-radius:50%;border:1px solid #fff5;background:#0004;display:none}
@media (max-width:560px){.p1{top:5%}.p2{top:9%}.bf{right:10%;bottom:10%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<button id="mus" aria-label="Music">♪</button>

<main>
<section id="hero">
  <figure class="pola p1"></figure><figure class="pola p2"></figure><figure class="pola p3"></figure>
  <div class="bf" aria-hidden="true"><svg viewBox="0 0 100 80"><path d="M50 40C40 5 6 0 4 22c-1 16 22 22 46 18z" fill="#f4a3c4"/><path d="M50 42C36 62 22 80 36 78c14-2 18-22 14-36z" fill="#e88ab4"/><path d="M50 40C60 5 94 0 96 22c1 16-22 22-46 18z" fill="#f6b8d0"/><path d="M50 42c14 20 28 38 14 36-14-2-18-22-14-36z" fill="#e88ab4"/><rect x="48" y="26" width="4" height="40" rx="2" fill="#5b1a6b"/></svg></div>
  <div class="env" id="env">
    <div class="back"></div>
    <div class="paper"><div><b id="envName"></b><i>a little something for you</i></div></div>
    <div class="pocket"></div><div class="flap"></div>
    <button class="seal" id="seal" aria-label="Open the envelope">✦</button>
  </div>
  <p class="hint">tap the seal</p>
</section>

<section class="after" id="letter">
  <div class="card">
    <span class="date" id="date"></span>
    <h2 id="title"></h2>
    <p id="msg"></p>
    <div class="sig" id="sig"></div>
  </div>
</section>

<section class="after" id="gallery">
  <h3>Some of my favourites</h3>
  <div class="strip" id="strip"></div>
</section>

<section class="after" id="cake">
  <h3>Make a wish</h3>
  <div class="cake" id="cakeEl"><div class="layer l1"></div><div class="layer l2"></div>
    <div class="candle"><div class="flame"></div></div><div class="candle"><div class="flame"></div></div><div class="candle"><div class="flame"></div></div></div>
  <div class="wish" id="wish"></div>
  <button class="btn" id="blow">Blow out the candles</button>
</section>
<footer class="after" id="foot"></footer>
</main>

/* ======================================== */

const $ = s => document.querySelector(s), reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
if (CONFIG.rtl) document.documentElement.dir = 'rtl';
const ph = i => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 375'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#c26bd1'/><stop offset='1' stop-color='#4a1259'/></linearGradient></defs><rect width='300' height='375' fill='url(#g)'/><text x='150' y='192' fill='#fff' fill-opacity='.75' font-size='22' text-anchor='middle' font-family='serif'>Photo ${i + 1}</text></svg>`);
const src = i => CONFIG.photos[i] || ph(i);

document.querySelectorAll('.pola').forEach((f, i) => f.innerHTML = `<img alt="" src="${src(i)}">`);
$('#strip').innerHTML = [3, 4, 5].map((n, k) => `<figure><img alt="" src="${src(n)}">${CONFIG.captions[k] || ''}</figure>`).join('');
$('#envName').textContent = CONFIG.name;
CONFIG.date ? $('#date').textContent = CONFIG.date : $('#date').remove();
$('#title').textContent = CONFIG.title + ', ' + CONFIG.name;
$('#sig').textContent = '— ' + CONFIG.from;
$('#foot').textContent = CONFIG.footer;
document.title = CONFIG.title + ' ' + CONFIG.name;

/* --- canvas: petals + confetti --- */
const cv = $('#fx'), cx = cv.getContext('2d'), COL = ['#f6c9d8', '#e88ab4', '#c26bd1', '#e8c27a', '#ffffff'];
let W, H, P = [];
const rs = () => { W = cv.width = innerWidth; H = cv.height = innerHeight }; rs(); addEventListener('resize', rs);
const add = (x, y, vx, vy, t) => P.push({ x, y, vx, vy, t, r: Math.random() * 6.3, vr: (Math.random() - .5) * .2, s: 4 + Math.random() * 7, c: COL[Math.random() * 5 | 0], ph: Math.random() * 9 });
function burst(x, y, n = 110) { if (reduce) n = 25; for (let i = 0; i < n; i++) add(x, y, (Math.random() - .5) * 14, -Math.random() * 14 - 3, Math.random() < .5 ? 'p' : 'c') }
(function loop() {
  cx.clearRect(0, 0, W, H);
  if (!reduce && P.length < 60 && Math.random() < .05) add(Math.random() * W, -12, 0, .7 + Math.random(), 'a');
  P = P.filter(p => p.y < H + 20);
  for (const p of P) {
    if (p.t === 'a') { p.x += Math.sin(p.ph += .02) * .8 } else { p.vy += .2; p.vx *= .99; p.x += p.vx }
    p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.globalAlpha = p.t === 'a' ? .7 : 1; cx.beginPath();
    p.t === 'c' ? cx.rect(-p.s / 2, -p.s / 4, p.s, p.s / 2) : cx.ellipse(0, 0, p.s, p.s / 2, 0, 0, 6.3);
    cx.fill(); cx.restore();
  }
  requestAnimationFrame(loop);
})();

/* --- sparkle cursor trail --- */
let last = 0;
addEventListener('pointermove', e => {
  const h = $('#hero'); h.style.setProperty('--px', (e.clientX / innerWidth - .5) * 2); h.style.setProperty('--py', (e.clientY / innerHeight - .5) * 2);
  if (reduce || e.timeStamp - last < 55) return; last = e.timeStamp;
  const s = document.createElement('i'); s.className = 'spk'; s.style.left = e.clientX - 5 + 'px'; s.style.top = e.clientY - 5 + 'px';
  document.body.appendChild(s); setTimeout(() => s.remove(), 800);
});

/* --- typewriter --- */
function type(el, text, ms = 38) { el.textContent = ''; let i = 0; const t = setInterval(() => { el.textContent += text[i++]; if (i >= text.length) clearInterval(t) }, ms) }

/* --- open the envelope --- */
$('#seal').addEventListener('click', e => {
  $('#env').classList.add('open'); document.body.classList.add('opened');
  const r = e.currentTarget.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2);
  setTimeout(() => $('#letter').scrollIntoView({ behavior: 'smooth' }), 1900);
  new IntersectionObserver((en, ob) => { if (en[0].isIntersecting) { ob.disconnect(); reduce ? $('#msg').textContent = CONFIG.message : type($('#msg'), CONFIG.message) } }, { threshold: .4 }).observe($('#letter'));
  playMusic();
});

/* --- candles --- */
$('#blow').addEventListener('click', () => {
  $('#cake').classList.add('blown'); $('#wish').textContent = CONFIG.wish;
  const r = $('#cakeEl').getBoundingClientRect(); burst(r.left + r.width / 2, r.top, 160);
  $('#blow').textContent = 'Again ✦'; setTimeout(() => $('#cake').classList.remove('blown'), 6000);
});

/* --- optional music --- */
let audio; const mb = $('#mus');
function playMusic() { if (!CONFIG.music) return; audio = new Audio(CONFIG.music); audio.loop = true; audio.volume = CONFIG.musicVolume ?? .7; audio.addEventListener('loadedmetadata', () => audio.currentTime = CONFIG.musicStart || 0); audio.play().catch(() => { }); mb.style.display = 'block' }
mb.addEventListener('click', () => { audio.paused ? audio.play() : audio.pause(); mb.style.opacity = audio.paused ? .5 : 1 });
</script>
